<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Client Portal icon</title>
  <desc id="desc">A glowing teal and gold portal arch with a path leading inward.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0" stop-color="#114f56"/>
      <stop offset="0.65" stop-color="#0b3942"/>
      <stop offset="1" stop-color="#082b33"/>
    </radialGradient>
    <linearGradient id="ring" x1="18" y1="12" x2="78" y2="84" gradientUnits="userSpaceOnUse">
